name: Build and Push to Docker Hub

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar o Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extrair o short hash do commit
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Build e Push da Imagem
        uses: docker/build-push-action@v5
        with:
          context: .
          # Mude 'cjas-backend' para o nome exato do seu repositório no Docker Hub
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/cjas-backend:latest
            ${{ secrets.DOCKER_USERNAME }}/cjas-backend:${{ steps.vars.outputs.sha_short }}